name: mayfly-showcase
# One job per trigger, run inside a fresh single-use Mayfly MicroVM. It fingerprints
# the VM it's running in and posts a "receipt" back to the demo API, which the live
# site renders. Plain-shell only — the default mayfly-runner image is the lean variant.
on:
  workflow_dispatch:
  # Fire on pushes and PRs so every change runs its checks in a fresh MicroVM.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  showcase:
    runs-on: [self-hosted, mayfly]
    steps:
      - name: Fingerprint this MicroVM and post the receipt
        env:
          API: ${{ vars.MAYFLY_DEMO_API }}          # e.g. https://<demo-api>.lambda-url…on.aws
          TOKEN: ${{ secrets.MAYFLY_RECEIPT_TOKEN }} # shared secret the API checks
        run: |
          set -eu
          start=$(date +%s.%N)
          arch="$(uname -m)"                 # aarch64 on Graviton
          kernel="$(uname -r)"
          host="$(uname -n)"                 # always "localhost" in the guest — not an identity
          # arch/kernel/host all come from the image, so they are IDENTICAL across VMs by
          # construction and prove nothing about freshness on their own. boot_id is generated
          # by the kernel at boot, so a value unique to this run is real evidence of a distinct
          # boot. (If we ever resume VMs from a snapshot, boot_id repeats by design — restate
          # the claim then rather than reading a repeat as a failure.)
          boot_id="$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unknown)"
          if [ "$boot_id" = "unknown" ]; then
            boot_note="(unavailable — this run carries no evidence of a distinct boot)"
            boot_claim="_No boot id: this run does not, on its own, show the VM was fresh._"
          else
            boot_note="(kernel-generated at boot — differs on every fresh VM)"
            boot_claim="_Freshness rests on the boot id: compare it against another run's._"
          fi
          # /tmp is NOT empty — but not because of leftover state. Observed entries are the
          # Actions runner's own .NET diagnostic sockets (clr-debug-pipe-*, dotnet-diagnostic-*),
          # created by the listener and worker processes in THIS VM during THIS job; the PIDs
          # are embedded in the names. So the count is never 0, and nothing in it came from a
          # prior job. List what is actually there rather than asserting either emptiness or
          # an origin we have not checked.
          tmp_files="$(ls -A /tmp 2>/dev/null | wc -l | tr -d ' ')"
          tmp_entries="$(ls -A /tmp 2>/dev/null | sort | tr '\n' ' ' | sed 's/ $//')"
          echo "arch=$arch kernel=$kernel host=$host boot_id=$boot_id tmp=$tmp_files [$tmp_entries]"
          end=$(date +%s.%N)
          dur_ms=$(awk "BEGIN{printf \"%d\", ($end-$start)*1000}")

          # Human-readable evidence in the GitHub run summary.
          {
            echo "### Ran in a fresh Mayfly MicroVM"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| arch | \`$arch\` |"
            echo "| kernel | \`Linux $kernel\` (from the image — same on every VM) |"
            echo "| host | \`$host\` (the guest hostname — same on every VM, not an identity) |"
            echo "| runner | \`${RUNNER_NAME:-unknown}\` |"
            echo "| boot id | \`$boot_id\` $boot_note |"
            echo "| commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| /tmp at start | \`$tmp_files\` entries: \`${tmp_entries:-<none>}\` |"
            echo ""
            echo "_This VM existed for exactly one job. It no longer exists._"
            echo "$boot_claim"
          } >> "$GITHUB_STEP_SUMMARY"

          # Machine-readable receipt for the live site (best-effort; skip if API unset).
          if [ -n "${API:-}" ]; then
            base="${API%/}"   # strip any trailing slash
            payload=$(printf '{"id":"%s","host":"%s","arch":"%s","kernel":"%s","boot":"%s","image":"mayfly-runner","sha":"%s","durMs":%s,"tmp":%s}' \
              "$GITHUB_RUN_ID" "${RUNNER_NAME:-$host}" "$arch" "$kernel" "$boot_id" "${GITHUB_SHA:0:7}" "$dur_ms" "$tmp_files")
            curl -fsS -X POST "$base/receipt" \
              -H "authorization: Bearer ${TOKEN:-}" \
              -H "content-type: application/json" \
              -d "$payload" || echo "receipt post failed (non-fatal)"
          fi
